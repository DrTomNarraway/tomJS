
<!DOCTYPE html>
<html>
<body>
    <script src="jatos.js" id="jatos"></script>
    <script src="tomJS.js" id="tomJS"></script>
    <script>

        const BLOCKS = 4;
        const CONDITION = [400, 600, 800, 1000, 1200, 1400];
        const FEEDBACK_DUR = 750;
        const ITI_DUR = [650, 750, 850];
        const ORIENTATION = [2, 358];
        const CONTRAST = 0.03;

        const args = {
            'verbose': true,
        };

        const tomJS = new Experiment(args);

        if (jatos.constructor != HTMLScriptElement) jatos.onConnected(() => { tomJS.connectToJatos(false) });

        const FR_TRIALWISE = {
            'gabor_ori': ORIENTATION
        };

        const FR_ADDITIONAL = {
            'condition': 'FR',
			'feedback_texts': {
                'Correct': ':)', 'Incorrect':':)',
				'Fast':':(', 'Slow':':(', 'Censored':':('
            },
            'gabor_contrast': CONTRAST,
            'stimulus': Stimuli.Gabor,
            'iti_duration': ITI_DUR,
            'trial_type': Trials.Trial,
            'feedback_duration': FEEDBACK_DUR
        };

        const FR_CONDITIONAL = [
            'if (gabor_ori > 180) target = A',
            'if (gabor_ori < 180) target = B'
        ];

        const DL_TRIALWISE = {
            'condition': CONDITION,
            'gabor_ori': ORIENTATION
        };

        const DL_ADDITIONAL = {
            'gabor_contrast': CONTRAST,
            'stimulus': Stimuli.Gabor,
            'iti_duration': ITI_DUR,
            'trial_type': Trials.CuedDeadline,
            'feedback_texts': {
                'Correct': ':)', 'Incorrect':':)',
				'Fast':':(', 'Slow':':(', 'Censored':':('
            },
            'feedback_duration': FEEDBACK_DUR
        };

        const DL_CONDITIONAL = [
            'if (gabor_ori > 180) target = A',
            'if (gabor_ori < 180) target = B'
        ];

        const ATTENTION = [];

        const _keyboard = new Slides.Slide([
            {'class': 'text', 'text': 'Welcome.','y': 0.25},
            {'class': 'text', 'text': '~tomJS.keyboard.key~', 'upper': true},
            {'class': 'text', 'text': 'Press F and J at the same time to continue.', 'y': 0.75}
        ]);

        const _dl_end_block = new Slides.EndBlock([
            { 'class': 'text', 'text': 'End of block. Please take a short break.', 'y': 0.25 },
            { 'class': 'text', 'text': 'The next block does not have time limits.', 'y': 0.50 },
            { 'class': 'text', 'text': 'Press F and J at the same time to continue.', 'y': 0.75 },
        ]);

        const _fr_end_block = new Slides.EndBlock([
            { 'class': 'text', 'text': 'End of block. Please take a short break.', 'y': 0.25 },
            { 'class': 'text', 'text': 'The next block has time limits.', 'y': 0.50 },
            { 'class': 'text', 'text': 'Press F and J at the same time to continue.', 'y': 0.75 },
        ]);

        const _end_exp = new Slides.EndExperiment([
            { 'class': 'text', 'text': 'End of Experiment. Thank you for your help.', 'y': 0.25 },
            { 'class': 'text', 'text': 'You were correct on ~this.data.accuracy~% of all test trials.', 'y': 0.48 },
            { 'class': 'text', 'text': 'You responded on time on ~this.data.hits~% of all test trials.', 'y': 0.52 },
            { 'class': 'text', 'text': 'Press F and J at the same time to end the experiment.', 'y': 0.75 },
        ]);

        const _fr_block = {
            'trialwise'     : FR_TRIALWISE,
            'additional'    : FR_ADDITIONAL,
            'conditional'   : FR_CONDITIONAL,
            'trial_reps'    : 2,
            'start_slide'   : null,
            'end_slide'     : _fr_end_block,
            'add_countdown' : true,
			'name'			: "FR"
        };

        const _dl_block = {
            'trialwise'     : DL_TRIALWISE,
            'additional'    : DL_ADDITIONAL,
            'conditional'   : DL_CONDITIONAL,
            'trial_reps'    : 2,
            'start_slide'   : null,
            'end_slide'     : _dl_end_block,
            'add_countdown' : true,
			'name'			: "DL"
        };

        tomJS.appendToTimeline(_keyboard);

        tomJS.appendCounterbalancedBlocks({'A':_fr_block, 'B':_dl_block, 'blocks':BLOCKS});

        tomJS.appendToTimeline(_end_exp);

        tomJS.start();

    </script>
</body>
</html>
