
<!DOCTYPE html>
<html>
<body>
    <script src="jatos.js" id="jatos"></script>
    <script src="tomJS.js" id="tomJS"></script>
    <script>

        // define constants ===================================================
		
        const BLOCKS       = 24; // number of test blocks.
        const CONTRAST     = 0.03; // gabor contrast, %.
        const FEEDBACK_DUR = 750; // ms.
        const ITI_DUR      = [650, 750, 850]; // blank screen after each trial, ms.
        const ORIENTATION  = [2, 358]; // degrees
        const SIGNAL       = Stimuli.NecroDancerBar; // type of progress bar to use.
        const SOA          = [400, 600, 800, 1000, 1200, 1400]; // target-signal SOA, ms.
        const STIMULUS     = Stimuli.Gabor; // class of target stimulus.
		const SIGNAL_FOR   = 300; // milliseconds

        // set up experiment ==================================================

        const args = {};

        const tomJS = new Experiment(args);

        if (jatos.constructor != HTMLScriptElement) jatos.onConnected(() => { tomJS.connectToJatos(false) });

        // trial arguments ====================================================

		// gabor training
		
		const _gt_trialwise = {
			'fixation_duration' : SOA,
            'gabor_ori': ORIENTATION
        };

        const _gt_additional = {
            'condition': 'GT',
			'feedback_texts': {
                    'Correct': 'Correct', 'Incorrect':'Incorrect',
					'Fast':'Too Fast', 'Slow':'Miss', 'Censored':'Miss'
                },
            'gabor_contrast': CONTRAST,
            'stimulus': Stimuli.Gabor,
            'iti_duration': ITI_DUR,
            'trial_type': Trials.Trial
        };

        const _gt_conditional = [
            'if (gabor_ori > 180) target = A',
            'if (gabor_ori < 180) target = B',
        ];
		
		const _gt_attention = [];

        // timing training

        const _tt_trialwise = {
            'condition': SOA,
            'text_text': ['F', 'J']
        };

        const _tt_additional = {
            'feedback_duration': FEEDBACK_DUR,
            'iti_duration': ITI_DUR,
            'signal': SIGNAL,
			'signal_for': SIGNAL_FOR,
            'stimulus': Stimuli.Text,
            'trial_type': Trials.ProgressBarResponseSignal
        };

        const _tt_conditional = [
            'if (text_text == F) target = A',
            'if (text_text == J) target = F',
            'if (condition == 400) fixation_duration = 1600',
            'if (condition == 600) fixation_duration = 1400',
            'if (condition == 800) fixation_duration = 1200',
			'if (condition == 1000) fixation_duration = 1000',
            'if (condition == 1200) fixation_duration = 800',
            'if (condition == 1400) fixation_duration = 600'
        ];

        const _tt_attention = [];
		
		// final practice
		
		const _pr_trialwise = {
            'condition': SOA,
            'gabor_ori': ORIENTATION
        };

        const _pr_additional = {            
            'feedback_duration': FEEDBACK_DUR,
            'gabor_contrast': CONTRAST,
            'iti_duration': ITI_DUR,
            'signal': SIGNAL,
			'signal_for': SIGNAL_FOR,
            'stimulus': STIMULUS,
            'trial_type': Trials.ProgressBarResponseSignal
        };

        const _pr_conditional = [
            'if (gabor_ori > 180) target = A',
            'if (gabor_ori < 180) target = B',
            'if (condition == 400) fixation_duration = 1600',
            'if (condition == 600) fixation_duration = 1400',
            'if (condition == 800) fixation_duration = 1200',
			'if (condition == 1000) fixation_duration = 1000',
            'if (condition == 1200) fixation_duration = 800',
            'if (condition == 1400) fixation_duration = 600'
        ];

        // free response

        const _fr_trialwise = {
			'fixation_duration' : SOA,
            'gabor_ori': ORIENTATION
        };

        const _fr_additional = {
            'condition': 'FR',
			'feedback_texts': {
                    'Correct': 'Hit', 'Incorrect':'Hit',
					'Fast':'Too Fast', 'Slow':'Miss', 'Censored':'Miss'
                },
            'gabor_contrast': CONTRAST,
            'stimulus': Stimuli.Gabor,
            'iti_duration': ITI_DUR,
            'trial_type': Trials.Trial
        };

        const _fr_conditional = [
            'if (gabor_ori > 180) target = A',
            'if (gabor_ori < 180) target = B',
        ];

        const _fr_attention = [
            {
                'condition': 'FR',
                'feedback_texts': {
                    'Correct': 'Pass',
                    'Incorrect': 'Fail', 'Fast': 'Fail', 'Slow': 'Fail', 'Censored': 'Fail'
                },
                'gabor_contrast': 1.00,
                'gabor_ori': 5,
                'stimulus': Stimuli.Gabor,
                'target': 'B',
                'trial_type': Trials.Trial
            },
            {
                'condition': 'FR',
                'feedback_texts': {
                    'Correct': 'Pass',
                    'Incorrect': 'Fail', 'Fast': 'Fail', 'Slow': 'Fail', 'Censored': 'Fail'
                },
                'gabor_contrast': 1.00,
                'gabor_ori': 355,
                'stimulus': Stimuli.Gabor,
                'target': 'A',
                'trial_type': Trials.Trial
            }
        ];

        // response signal

        const _rs_trialwise = {
            'condition': SOA,
            'gabor_ori': ORIENTATION
        };

        const _rs_additional = {            
            'feedback_duration': FEEDBACK_DUR,
            'gabor_contrast': CONTRAST,
            'iti_duration': ITI_DUR,
            'signal': SIGNAL,
			'signal_for': SIGNAL_FOR,
            'stimulus': STIMULUS,
            'trial_type': Trials.ProgressBarResponseSignal
        };

        const _rs_conditional = [
            'if (gabor_ori > 180) target = A',
            'if (gabor_ori < 180) target = B',
            'if (condition == 400) fixation_duration = 1600',
            'if (condition == 600) fixation_duration = 1400',
            'if (condition == 800) fixation_duration = 1200',
			'if (condition == 1000) fixation_duration = 1000',
            'if (condition == 1200) fixation_duration = 800',
            'if (condition == 1400) fixation_duration = 600'
        ];

        const _rs_attention = [
            {
                'condition': 0,
                'fixation_duration': 0,
                'feedback_texts': {
                    'Correct': 'Pass',
                    'Incorrect':'Fail','Fast':'Fail','Slow':'Fail','Censored':'Fail'
                },
                'gabor_contrast': 1.00,
                'gabor_ori': 5,
                'signal': Stimuli.NecroDancerBar,
                'signal_for': 3000,
                'stimulus': Stimuli.Gabor,
                'target': 'B',
                'trial_type': Trials.ProgressBarResponseSignal
            },
            {
                'condition': 0,
                'fixation_duration': 0,
                'feedback_texts': {
                    'Correct':'Pass',
                    'Incorrect':'Fail','Fast':'Fail','Slow':'Fail','Censored':'Fail'
                },
                'gabor_contrast': 1.00,
                'gabor_ori': 355,
                'signal': Stimuli.NecroDancerBar,
                'signal_for': 3000,
                'stimulus': Stimuli.Gabor,
                'target': 'A',
                'trial_type': Trials.ProgressBarResponseSignal
            }
        ];

        // slides =============================================================

		const _fullscreen = new Slides.Fullscreen();

        const _credit_card = new Slides.CreditCard();

        const _demographics = new Slides.Demographics();

        const _keyboard = new Slides.Slide([
            { 'class': 'text', 'text': 'Please press F and then J a few times to make sure your', 'y': 0.25 },
            { 'class': 'text', 'text': 'keyboard is being read by the experiment correctly.', 'y': 0.30 },
            { 'class': 'text', 'text': '~tomJS.keyboard.key~', 'upper': true },
            { 'class': 'text', 'text': 'Press F and J at the same time to continue.', 'y': 0.75, 'conditions': ['~this.can_proceed~ == true']  },
        ]);

        const _procedure = new Slides.Slide([
            { 'class': 'text', 'text': 'During the experiment you will perform blocks of trials which take around 2 minutes each.', 'y': 0.20 },
            { 'class': 'text', 'text': 'After each block you will be given feedback on your performance for that block.', 'y': 0.25 },
            { 'class': 'text', 'text': 'Your performance will be marked as "needing improvement", "good" or "great".', 'y': 0.30 },
            { 'class': 'text', 'text': 'First, you will be trained in how to respond to the stimulus, and then how to time your responses.', 'y': 0.45 },
            { 'class': 'text', 'text': 'After both training blocks you will have a practice block and then start the real experiment.', 'y': 0.50 },
            { 'class': 'text', 'text': 'Most participants take 60 minutes to complete the entire experiment.', 'y': 0.55 },
            { 'class': 'text', 'text': 'Press F and J at the same time to continue.', 'y': 0.75, 'conditions': ['~this.can_proceed~ == true'] },
        ]);

        const _gabor = new Slides.Slide([
            { 'class': 'text', 'text': 'On each trial you will see a stimulus like the one below, leaning to the left or right.', 'y': 0.25 },
            { 'class': 'text', 'text': 'For the first block your task is to press F if you think the answer is left or J if you think it is right.', 'y': 0.30 },
            { 'class': 'text', 'text': 'You can press F or J now to see examples of each.', 'y': 0.35 },
            { 'class': 'gabor', 'gabor_size': 0.5, 'gabor_contrast': 0.03, 'gabor_ori': 2, 'gabor_y': 0.55 },
            { 'class': 'text', 'text': 'Press F and J at the same time to start stimulus training.', 'y': 0.75, 'conditions': ['~this.can_proceed~ == true']  },
        ]);

        const _gt_end_block = new Slides.EndBlock([
            { 'class': 'text', 'text': 'End of stimulus training. Please take a short break.', 'y': 0.25 },
            { 'class': 'text', 'text': 'Your accuracy was great!', 'conditions': ['~this.data.accuracy~ >= 80'] },
            { 'class': 'text', 'text': 'Your accuracy was good.', 'conditions': ['~this.data.accuracy~ < 80', '~this.data.accuracy~ >= 60'] },
            { 'class': 'text', 'text': 'Your accuracy needs improvement.', 'conditions': ['~this.data.accuracy~ < 60'] },
            { 'class': 'text', 'text': 'Press F and J at the same time to continue.', 'y': 0.75, 'conditions': ['~this.can_proceed~ == true']  }
        ]);

        const _timing = new Slides.Slide([
            { 'class': 'text', 'text': 'In some blocks will see a bar at the top of the screen with two moving notes.', 'y': 0.10 },
            { 'class': 'text', 'text': 'The middle of the timer has a box called the response window.', 'y': 0.15 },
            { 'class': 'text', 'text': 'You are trying to respond when the notes are inside the response window.', 'y': 0.20 },
            { 'class': 'text', 'text': 'While the notes are in the response window, they will all turn blue to make it easier to notice.', 'y': 0.25 },
            { 'class': 'text', 'text': 'If you miss the response window, simply respond as soon as possible.', 'y': 0.30 },
            { 'class': 'text', 'text': 'For this training block press the indicated letter while the bar is inside the response window.', 'y': 0.35 },
            { 'class': 'progressbar', 'signal': SIGNAL, 'bar_y': 0.45, 'signal_on': 0.8, 'signal_off': 1, 'bar_scale': 0.50 },
            { 'class': 'text', 'text': 'F', 'y': 0.55 },
            { 'class': 'text', 'text': 'Press F and J at the same time to start timing training.', 'y': 0.75, 'conditions': ['~this.can_proceed~ == true'] }
        ]);

        const _tt_end_block = new Slides.EndBlock([
            { 'class': 'text', 'text': 'End of timing training. Please take a short break.', 'y': 0.25 },
            { 'class': 'text', 'text': 'Your timing was great!', 'conditions': ['~this.data.hits~ >= 80'] },
            { 'class': 'text', 'text': 'Your timing was good.', 'conditions': ['~this.data.hits~ < 80', '~this.data.hits~ >= 60'] },
            { 'class': 'text', 'text': 'Your timing needs improvement.', 'conditions': ['~this.data.hits~ < 60'] },
            { 'class': 'text', 'text': 'Press F and J at the same time to continue.', 'y': 0.75, 'conditions': ['~this.can_proceed~ == true']  }
        ]);

        const _practice = new Slides.Slide([
            { 'class': 'text', 'text': 'From now on, some blocks will have a response window while others will not.', 'y': 0.15 },
            { 'class': 'text', 'text': 'If you miss the response window, please respond as soon as possible.', 'y': 0.20 },
            { 'class': 'text', 'text': 'The next block is a practice block that combines your training.', 'y': 0.25 },
            { 'class': 'progressbar', 'signal': SIGNAL, 'bar_y': 0.35, 'signal_on': 0.8, 'signal_off': 1, 'bar_scale': 0.50 },
            { 'class': 'gabor', 'gabor_contrast': 0.03, 'gabor_size': 0.40, 'gabor_ori': 2 },
            { 'class': 'text', 'text': 'Press F and J at the same time to start the practice block.', 'y': 0.75, 'conditions': ['~this.can_proceed~ == true']  }
        ]);
		
		const _pr_end_block = new Slides.EndBlock([
            { 'class': 'text', 'text': 'End of practice block. Please take a short break.', 'y': 0.25 },
            { 'class': 'text', 'text': 'Your accuracy was great!', 'y': 0.48, 'conditions': ['~this.data.accuracy~ >= 80'] },
            { 'class': 'text', 'text': 'Your accuracy was good.', 'y': 0.48, 'conditions': ['~this.data.accuracy~ < 80', '~this.data.accuracy~ >= 60'] },
            { 'class': 'text', 'text': 'Your accuracy needs improvement.', 'y': 0.48, 'conditions': ['~this.data.accuracy~ < 60'] },
            { 'class': 'text', 'text': 'Your timing was great!', 'y': 0.52, 'conditions': ['~this.data.hits~ >= 80'] },
            { 'class': 'text', 'text': 'Your timing was good.', 'y': 0.52, 'conditions': ['~this.data.hits~ < 80', '~this.data.hits~ >= 60'] },
            { 'class': 'text', 'text': 'Your timing needs improvement.', 'y': 0.52, 'conditions': ['~this.data.hits~ < 60'] },
            { 'class': 'text', 'text': 'Press F and J at the same time to continue.', 'y': 0.75, 'conditions': ['~this.can_proceed~ == true']  }
        ]);
		
		const _checks = new Slides.Slide([
			{ 'class': 'text', 'text': 'You are now entering the real experiment. From now on some trials are attention checks.', 'y': 0.10 },
            { 'class': 'text', 'text': 'Attention checks are very easy versions of the main task meant to prevent low-effort submissions.', 'y': 0.15 },
            { 'class': 'text', 'text': 'As per Prolific policy, if you fail too many attention checks the experiment will end and you ', 'y': 0.20 },
            { 'class': 'text', 'text': 'will be asked to return your submission.', 'y': 0.25 },
            { 'class': 'progressbar', 'signal': SIGNAL, 'bar_y': 0.35, 'signal_on': 0, 'signal_off': 1, 'bar_scale': 0.50, 'window_width': 1.0 },
            { 'class': 'gabor', 'gabor_contrast': 1.00, 'gabor_size': 0.40, 'gabor_ori': 5, 'gabor_y': 0.50 },
			{ 'class': 'text', 'text': 'The next block does not have a response window.', 'y': 0.70, 'conditions': ['~tomJS.demographics.G~ == 0'] },
			{ 'class': 'text', 'text': 'The next block has a response window.', 'y': 0.70, 'conditions': ['~tomJS.demographics.G~ == 1'] },
            { 'class': 'text', 'text': 'Press F and J at the same time to start the first test block.', 'y': 0.75, 'conditions': ['~this.can_proceed~ == true'] }
        ]);

        const _half = new Slides.EndBlock([
            { 'class': 'text', 'text': 'You are now half-way through the experiment.', 'y': 0.15 },
            { 'class': 'text', 'text': 'So far your accuracy has been great!', 'y': 0.48, 'conditions': ['~this.data.accuracy~ >= 80'] },
            { 'class': 'text', 'text': 'So far your accuracy has been good.', 'y': 0.48, 'conditions': ['~this.data.accuracy~ < 80', '~this.data.accuracy~ >= 60'] },
            { 'class': 'text', 'text': 'Your accuracy needs improvement.', 'y': 0.48, 'conditions': ['~this.data.accuracy~ < 60'] },
            { 'class': 'text', 'text': 'So far your timing has been great!', 'y': 0.52, 'conditions': ['~this.data.hits~ >= 80'] },
            { 'class': 'text', 'text': 'So far your timing has been good.', 'y': 0.52, 'conditions': ['~this.data.hits~ < 80', '~this.data.hits~ >= 60'] },
            { 'class': 'text', 'text': 'Your timing needs improvement.', 'y': 0.52, 'conditions': ['~this.data.hits~ < 60'] },
            { 'class': 'text', 'text': 'Press F and J at the same time to continue.', 'y': 0.75, 'conditions': ['~this.can_proceed~ == true']  }
        ], { 'filter': 'block <= 0' });

        const _fr_end_block = new Slides.EndBlock([
            { 'class': 'text', 'text': 'End of block. Please take a short break.', 'y': 0.25 },
            { 'class': 'text', 'text': 'Your accuracy was great!', 'y': 0.48, 'conditions': ['~this.data.accuracy~ >= 80'] },
            { 'class': 'text', 'text': 'Your accuracy was good.', 'y': 0.48, 'conditions': ['~this.data.accuracy~ < 80', '~this.data.accuracy~ >= 60'] },
            { 'class': 'text', 'text': 'Your accuracy needs improvement.', 'y': 0.48, 'conditions': ['~this.data.accuracy~ < 60'] },           
			{ 'class': 'text', 'text': 'The next block has a response window.', 'y': 0.70 },
            { 'class': 'text', 'text': 'Press F and J at the same time to continue.', 'y': 0.75, 'conditions': ['~this.can_proceed~ == true']  }
        ]);
		
		const _rs_end_block = new Slides.EndBlock([
            { 'class': 'text', 'text': 'End of block. Please take a short break.', 'y': 0.25 },
            { 'class': 'text', 'text': 'Your accuracy was great!', 'y': 0.48, 'conditions': ['~this.data.accuracy~ >= 80'] },
            { 'class': 'text', 'text': 'Your accuracy was good.', 'y': 0.48, 'conditions': ['~this.data.accuracy~ < 80', '~this.data.accuracy~ >= 60'] },
            { 'class': 'text', 'text': 'Your accuracy needs improvement.', 'y': 0.48, 'conditions': ['~this.data.accuracy~ < 60'] },
            { 'class': 'text', 'text': 'Your timing was great!', 'y': 0.52, 'conditions': ['~this.data.hits~ >= 80'] },
            { 'class': 'text', 'text': 'Your timing was good.', 'y': 0.52, 'conditions': ['~this.data.hits~ < 80', '~this.data.hits~ >= 60'] },
            { 'class': 'text', 'text': 'Your timing needs improvement.', 'y': 0.52, 'conditions': ['~this.data.hits~ < 60'] },
			{ 'class': 'text', 'text': 'The next block does not have a response window.', 'y': 0.70 },
            { 'class': 'text', 'text': 'Press F and J at the same time to continue.', 'y': 0.75, 'conditions': ['~this.can_proceed~ == true']  }
        ]);

        const _end_exp = new Slides.EndExperiment([
            { 'class': 'text', 'text': 'End of Experiment. Thank you for your help.', 'y': 0.25 },
            { 'class': 'text', 'text': 'If you have any questions or feedback please to message on Prolific.', 'y': 0.30 },
            { 'class': 'text', 'text': 'You were correct on ~this.data.accuracy~% of all test trials.', 'y': 0.48 },
            { 'class': 'text', 'text': 'You responded on time on ~this.data.hits~% of all test trials.', 'y': 0.52 },
            { 'class': 'text', 'text': 'Press F and J at the same time to end the experiment.', 'y': 0.75, 'conditions': ['~this.can_proceed~ == true']  }
        ]);

        // block argument chunks ==============================================

		const _gt_block = {
            'trialwise'     : _gt_trialwise,
            'additional'    : _gt_additional,
            'conditional'   : _gt_conditional,
            'attention'     : [],
            'trial_reps'    : 1, // 6 fixation durations * 2 directions = 12 trials gabor training trials
            'start_slide'   : null,
            'end_slide'     : _gt_end_block,
            'add_countdown' : true,
			'name'			: "GT"
        };

        const _tt_block = {
            'trialwise'     : _tt_trialwise,
            'additional'    : _tt_additional,
            'conditional'   : _tt_conditional,
            'attention'     : [],
            'trial_reps'    : 2, // 6 SOAs * 2 directions * 2 reps = 24 timing training trials
            'start_slide'   : null,
            'end_slide'     : _tt_end_block,
            'add_countdown' : true,
			'name'			: "TT"
        };
		
		const _pr_block = {
            'trialwise'     : _pr_trialwise,
            'additional'    : _pr_additional,
            'conditional'   : _pr_conditional,
            'attention'     : [],
            'trial_reps'    : 2, // 6 SOAs * 2 directions * 2 reps = 24 practicle trials
            'start_slide'   : null,
            'end_slide'     : _pr_end_block,
            'add_countdown' : true,
			'name'			: "PR"
        };

        const _fr_block = {
            'trialwise'     : _fr_trialwise,
            'additional'    : _fr_additional,
            'conditional'   : _fr_conditional,
            'attention'     : _fr_attention, // two attention trials per block
            'trial_reps'    : 2, // 6 SOAs * 2 directions * 2 reps = 24 test trials per block.
            'start_slide'   : null,
            'end_slide'     : _fr_end_block,
            'add_countdown' : true,
			'name'			: "FR"
        };

        const _rs_block = {
            'trialwise'     : _rs_trialwise,
            'additional'    : _rs_additional,
            'conditional'   : _rs_conditional,
            'attention'     : _rs_attention, // two attention trials per block
            'trial_reps'    : 2, // 6 SOAs * 2 directions * 2 reps = 24 test trials per block.
            'start_slide'   : null,
            'end_slide'     : _rs_end_block,
            'add_countdown' : true,
			'name'			: "RS"
        };

        // timeline ===========================================================
		
		tomJS.appendToTimeline(_fullscreen);
		tomJS.appendToTimeline(_credit_card);
		tomJS.appendToTimeline(_keyboard);        
		tomJS.appendToTimeline(_demographics);
		tomJS.appendToTimeline(_procedure);
		
		tomJS.appendToTimeline(_gabor);
		tomJS.appendBlock(_gt_block);
		
		tomJS.appendToTimeline(_timing);
		tomJS.appendBlock(_tt_block);
		
		tomJS.appendToTimeline(_practice);
		tomJS.appendBlock(_pr_block);
		
        tomJS.appendToTimeline(_checks);

		tomJS.queue('appendCounterbalancedBlocks', {'A':_fr_block, 'B':_rs_block, 'blocks':BLOCKS/2});
		
        tomJS.queue('appendToTimeline', _half);

        tomJS.queue('appendCounterbalancedBlocks', {'A':_rs_block, 'B':_fr_block, 'blocks':BLOCKS/2});

		tomJS.queue('appendToTimeline', _end_exp);
		
        // run ================================================================

        tomJS.start();

    </script>
</body>
</html>
